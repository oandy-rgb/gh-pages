<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f7f7f4;--sur:#fff;--txt:#20231f;--mut:#687064;--line:#d9ded5;--acc:#2f6f5e;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{background:var(--bg);color:var(--txt);display:flex;min-height:100vh}
nav{width:256px;flex-shrink:0;min-height:100vh;border-right:1px solid var(--line);
  background:var(--sur);padding:20px 14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{font-weight:700;font-size:15px;color:var(--txt);text-decoration:none;
  display:block;padding:0 6px 14px;border-bottom:1px solid var(--line);margin-bottom:12px}
.nav-item{display:block;padding:5px 8px;border-radius:5px;color:var(--mut);
  text-decoration:none;font-size:14px;margin-bottom:1px}
.nav-item:hover,.nav-item.active{background:var(--bg);color:var(--txt)}
.nav-item.active{color:var(--acc);font-weight:600}
main{flex:1;padding:48px 56px;max-width:800px}
h1{font-size:1.8rem;font-weight:700;margin-bottom:.75rem}
h2{font-size:1.3rem;font-weight:600;margin:2rem 0 .6rem}
h3{font-size:1.1rem;font-weight:600;margin:1.5rem 0 .5rem}
h4{font-size:1rem;font-weight:600;margin:1.2rem 0 .4rem}
p{line-height:1.75;margin-bottom:1rem}
ul,ol{margin:0 0 1rem 1.5rem}li{margin-bottom:.35rem;line-height:1.65}
a{color:var(--acc)}
code{background:var(--bg);border-radius:3px;padding:1px 5px;font-size:.88em;font-family:monospace}
pre{background:var(--bg);border-radius:8px;padding:16px;overflow-x:auto;margin-bottom:1rem}
pre code{background:none;padding:0;font-size:.86em}
blockquote{border-left:3px solid var(--line);padding-left:14px;color:var(--mut);margin-bottom:1rem}
img{max-width:100%;border-radius:6px;display:block;margin:1rem 0}
table{border-collapse:collapse;width:100%;margin-bottom:1rem}
th,td{border:1px solid var(--line);padding:7px 11px;text-align:left}
th{background:var(--bg);font-weight:600}
hr{border:none;border-top:1px solid var(--line);margin:2rem 0}
@media(max-width:680px){nav{display:none}main{padding:24px 20px}}</style>
</head>
